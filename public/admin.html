<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>admin — the rish turing test</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-shell admin">
    <header>
      <div class="avatar"></div>
      <div class="header-text">
        <h1>admin</h1>
        <p class="subtitle"><span class="dot"></span> intercept live chats</p>
      </div>
    </header>
    <div id="keyBar">
      <input id="adminKey" type="password" placeholder="admin key" />
      <button id="loadBtn">load</button>
    </div>
    <div id="sessions" class="messages"></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
